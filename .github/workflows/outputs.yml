name: 'Release'
on:
  workflow_dispatch: 
    inputs:
      release:
        description: 'Do release'
        required: true
        type: boolean

jobs:
  lsp-release:
    name: verison
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
    - run: |
        set -e
        echo version="1.0.0" >> $GITHUB_OUTPUT
      name: Set Version
      id: info

  build-vsix:
    needs: [lsp-release]
    if: |
      (needs.lsp-release.result == 'success' || needs.lsp-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "pip install ${ESBONIO_WHL}"
      name: Install
      env:
        ESBONIO_WHL: "${{ case(needs.lsp-release.outputs.version, format('esbonio=={0}', needs.lsp-release.outputs.version), 'esbonio') }}"
